<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultado del Diagnostico</title>
    <link rel="stylesheet" href="../static/css/estilos.css"">
</head>
<body>
    <h1>Resultado para "{{ result.plant_name }}" ({{ result.plant_type }})</h1>

    <div class="status {{ result.status.value }}">
        {{ result.status.value }}
    </div>

    <table>
        <tr><th>Indicador</th><th>Nivel</th></tr>
        <tr><td>Humedad</td><td>{{ result.levels['humidity'].value }}</td></tr>
        <tr><td>Luz</td><td>{{ result.levels['light'].value }}</td></tr>
        <tr><td>Temperatura</td><td>{{ result.levels['temperature'].value }}</td></tr>
    </table>

    <a href="/">← Nueva evaluacion</a>
</body>
</html>
